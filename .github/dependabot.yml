# Keeps the SHA-pinned actions in .github/workflows current: each update PR moves the SHA and its `# vX.Y.Z`
# comment together. npm dependencies are not covered; the lockfile is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
